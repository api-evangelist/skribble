aid: skribble

name: Skribble

description: Skribble (Skribble AG) is a Swiss electronic signature provider offering simple (SES/EES), advanced (AES/FES) and qualified (QES)
  electronic signatures that are legally valid under Swiss ZertES and EU eIDAS law, hosted in Switzerland and GDPR-compliant. Beyond its web app,
  Skribble publishes a developer portal at api.docs.skribble.com documenting the Sign API v2 (stable), Sign API v3 (preview, with draft workflows
  and multi-document requests) and the Validation API v1 for verifying signed PDFs and certificates.

