        write_access:
        - api_demo_example
        created_at: '2099-12-12T12:12:12.000Z'
        updated_at: '2099-12-12T12:12:12.000Z'
    SamplePDFForm:
      summary: Sample PDF with signature fields
      value:
        id: 8e725b0d-379c-5fd7-e7b7-ff369ac0c497
        parent_id: 461a654e-a2f5-7511-9e80-544abd6216e8
