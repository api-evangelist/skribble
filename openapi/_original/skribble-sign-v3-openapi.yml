    CallbackType_v3:
      title: Callback Type
      type: string
      description: |-
        The type of this callback.

        Possible values:
          - **SUCCESS** Is triggered when the document has been successfully signed by all parties involved.
          - **UPDATE** Is triggered on changes on the `SignatureRequest` object like when one person of all involved parties has signed.
          - **INITIATE** Is triggered when the signature request is initiated via the endpoint.
          - **ERROR** Is triggered when a person declines the signature or when the `SignatureRequest` is withdrawn.
          - **START_SIGN** Is triggered when a person starts the signature process (only for Express QES).
          - **IDENT_PENDING** Is triggered when the identification of a person within a signature process requires manual review.
          - **IDENT_ERROR** Is triggered when the identification of a person within a signature process ended in an error.
      enum:
        - SUCCESS
        - UPDATE
        - ERROR
        - START_SIGN
        - INITIATE
        - IDENT_PENDING
        - IDENT_ERROR
      example: SUCCESS
    CallbackState:
      title: Callback State
      type: string
      description: |-
        The state of the callback.

        Possible values:
          - **OPEN** The callback request will be executed in the next execution cycle.
          - **COMPLETED** The callback request was executed successfully. The API received an HTTP 2xx success code in response.
          - **RESIGNATED** The callback request has been attempted `attempts` times but was unsuccessful. The API did not receive a valid HTTP 2xx response.
      enum:
        - OPEN
        - COMPLETED
        - RESIGNATED
      example: COMPLETED
    SignatureCallbacksResponse_v3:
      title: Signature Callbacks in Response
      type: array
