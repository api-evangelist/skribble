    CreateSignatureObserverRequest:
      title: Signature Observer
      type: object
      description: |-
        Defines an observer target which can either be a USER or a GROUP.

        - For type USER, either email or user_id must be provided (but not both). When using email, a user will be automatically created if not present and returned.
        - For type GROUP, group_id must be provided and no user fields are allowed.
      required:
        - type
      properties:
        type:
          type: string
          description: Type of observer target.
          enum:
            - USER
            - GROUP
          example: USER
      oneOf:
        - title: User Observer
          type: object
          required:
            - type
          properties:
            type:
              const: USER
          oneOf:
            - title: User by Email
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the user.
                  example: observer@example.info
            - title: User by ID
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  description: Unique user identifier.
                  example: usr_123
        - title: Group Observer
          type: object
          required:
            - type
            - group_id
          properties:
            type:
              const: GROUP
            group_id:
              type: string
              description: Unique group identifier.
              example: gr_456
    VisualSignature:
      description: Visual signature placement information.
      oneOf:
        - type: object
          title: Single Position
          description: Use a single explicit position.
          required:
            - position
          properties:
            position:
              $ref: '#/components/schemas/VisualSignaturePosition'
            image:
              $ref: '#/components/schemas/VisualSignatureImage'
            positions:
              description: Must not be provided when position is used.
              readOnly: true
            form_field:
              description: Must not be provided when position is used.
              readOnly: true
        - type: object
          title: Multiple Positions
          description: Use multiple explicit positions.
          required:
            - positions
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/VisualSignaturePosition'
            image:
              $ref: '#/components/schemas/VisualSignatureImage'
            position:
              description: Must not be provided when positions are used.
              readOnly: true
            form_field:
              description: Must not be provided when positions are used.
              readOnly: true
        - type: object
          title: Form Field
          description: Use a form field only.
          required:
            - form_field
          properties:
            form_field:
              type: string
              description: |
                Name of the form field in which the signature is placed. If multiple fields of this name are present in the document, all will be used.
            text:
              type: object
              description: Optional text to display inside the form field.
              properties:
                content:
                  type: string
                  description: Content of the text field.
                  example: Customer Signature
                font_name:
                  type: string
                  description: |
                    Font name to use. It is just a suggestion. For PDF: all default PDF fonts can be used or fonts which are already embedded in the document. If not specified, the default font of the form field will be used.
                  example: Helvetica-Bold
                font_size:
                  type: string
                  description: Font size to use. If not specified, the default size for the form field will be used.
                  example: '12'
                font_color:
                  type: string
                  description: Font color to use as RGB value encoded in hex. Defaults to black (#000000).
                  example: '#ff0000'
            image:
              $ref: '#/components/schemas/VisualSignatureImage'
            position:
              description: Must not be provided when form_field is used.
              readOnly: true
            positions:
              description: Must not be provided when form_field is used.
              readOnly: true
