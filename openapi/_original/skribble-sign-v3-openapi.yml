        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
              examples:
                default:
                  $ref: '#/components/examples/Sample'
                form:
                  $ref: '#/components/examples/SamplePDFForm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Document
      summary: Delete a Document
      description: |-
        Deletes a `Document` by its ID. Deletion behaves similarly to deleting a
        `SignatureRequest` and does not necessarily remove the object from the
        system immediately.

        If more than one participant is involved, the DELETE request only removes
        the current user from the `Document`.

        The system permanently removes the `Document` once the last user deletes it
        via the Skribble web application.

        **Async cascade note:** If the `Document`'s parent `SignatureRequest` was
        recently deleted, the server-side cascade that removes associated documents
        runs asynchronously. During this window the document is still listed by
        `GET /documents` but returns `403 Forbidden` on delete attempts. Retry
        after a few seconds — the document will either have been removed by the
        cascade or the delete will succeed.
      operationId: deleteDocument
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/DocumentIDPath'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /documents/{DOC_ID}/content:
    get:
      tags:
        - Document
      summary: Get Document Content
      description: |-
        Downloads the content of the document identified by its ID. Returns either
        a PDF binary or a JSON object containing a Base64-encoded PDF.
      operationId: getDocumentContent
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/DocumentIDPath'
      responses:
        '200':
          description: PDF or JSON with Base64-encoded PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContentResponse'
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /documents/{DOC_ID}/pages/{PAGE_ID}:
    get:
      tags:
        - Document
      summary: Get Document Page Preview
      description: |-
        Returns a preview image for a specific page of the uploaded PDF document.
        Page numbering starts at **0** for the first page.

        > Use the optional `scale` parameter to control the preview size:
        > `scale=100` returns a full-size preview, while `scale=20` returns a
        > thumbnail.
      operationId: getDocumentPreview
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/DocumentIDPath'
        - $ref: '#/components/parameters/PageIDPath'
        - $ref: '#/components/parameters/ScaleFactor'
      responses:
        '200':
          description: Preview image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sendto:
    post:
      tags:
        - SendTo
      summary: Create a Send-To Request
      description: |-
        Starts the signing process by uploading the PDF document `content` and
        assigning it a `title`.

        ### Limited lifetime

        > Send-To objects and their related Documents and SignatureRequests are only
        > guaranteed for a **limited lifetime**.
        >
        > - A Send-To request that is not claimed by a user — i.e. where a user
        >   does not add the document to their list of documents to sign — is
        >   deleted automatically after one day.
        >
        > - All Send-To objects and their related Documents and SignatureRequest
        >   objects, regardless of status, are deleted automatically after 90 days.
      operationId: createSendTo
      security:
        - {}
      requestBody:
        description: Content can be sent directly as a file or base64-encoded in a JSON object
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                  description: Title of the document.
                  example: Document 1
                content:
                  type: string
                  format: binary
                  description: PDF file to upload.
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSendToRequest'
            examples:
              Base64Document:
                summary: Base64-encoded PDF
                value:
                  title: Document 1
                  content: SGVsbG8gd29ybGQh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSendToResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sendto/{SEND_TO_ID}/track:
    get:
      tags:
        - SendTo
      summary: Track a Send-To Request
      description: |-
        To call the `track` endpoint, you must include the value of the
        `access_code` field—received when creating the `Send-To` object—in the
        request header `X-Accesscode`.
      operationId: trackSendTo
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/XAccesscodeHeader'
        - $ref: '#/components/parameters/SendToIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackSendToResponse'
              examples:
                unclaimed:
                  $ref: '#/components/examples/SendToUnclaimed'
                claimed:
                  $ref: '#/components/examples/SendToClaimed'
                signed:
                  $ref: '#/components/examples/SendToSigned'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sendto/{SEND_TO_ID}/download:
    get:
      tags:
        - SendTo
      summary: Download Send-To Document
      description: |-
        To call the `download` endpoint, you must include the value of the
        `access_code` field—received when creating the `Send-To` object—in the
        request header `X-Accesscode`.

        The response contains the originally provided PDF document in its current
        state, which may be signed, declined, withdrawn, or still open for signing.
        The current status can be retrieved using the `track` endpoint.
      operationId: downloadSendTo
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/XAccesscodeHeader'
        - $ref: '#/components/parameters/SendToIdPath'
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                    format: byte
                    description: Base64-encoded document content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sendto/{SEND_TO_ID}:
    delete:
      tags:
        - SendTo
      summary: Delete a Send-To Request
      description: |-
        To call the `delete` endpoint, you must include the value of the
        `access_code` field—received when creating the `Send-To` object—in the
        request header `X-Accesscode`.

        This call deletes the involved `Send-To`, `Document`, and `SignatureRequest`
        objects regardless of the current `Send-To` state.
      operationId: deleteSendTo
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/XAccesscodeHeader'
        - $ref: '#/components/parameters/SendToIdPath'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /user/signature-qualities:
    get:
      tags:
        - User
      summary: Get Signature Quality Details for a User
      description: |-
        Returns the effective signature `quality` that will be applied when the
        given `username` signs a document.

        The resulting quality is determined by the combination of the requested
        `quality` and `legislation`, where `any` matches any legislation.

        For example, if you create a `SignatureRequest` with `quality=AES_MINIMAL`
        and `legislation=ZERTES`, this endpoint will indicate the final quality the
        user will sign with — typically `QES`, as `AES_MINIMAL` upgrades to `QES`
        when the user's settings allow it.
      operationId: getUserSignatureQualities
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/UserName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSignatureQualitiesResponse'
              examples:
                default:
                  $ref: '#/components/examples/UserSignatureQualitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /activities/signatures:
    get:
      tags:
        - Report
      summary: Get signature activities by business
      description: |
        Returns detailed signature `activities` for your business and its members within a specified date range.

        Use these parameters to filter for a specific time range.

        | **Parameter** | **Description** | **Mandatory** |
        | --- | --- | --- |
        | `start_date` | The start date of the range to fetch the signature `activities`.  Format: `yyyy-MM-dd.` | yes |
        | `end_date` | The end date of the range to fetch the signature `activities`.  Format: `yyyy-MM-dd.` | yes |

        ### **Pagination**

        The result set can be controlled using the optional pagination parameters `page` and `size`

        | **Parameter** | **Description** | **Mandatory** |
        | --- | --- | --- |
        | `page` | The page number to fetch the signature `activities`.  Must be a positive integer.  Default: 1 | no |
        | `size` | The size of the page to fetch the signature activities.  Must be a positive integer.  Default: 25  Maximum: 100 | no |
        | `sort` | The sort order of the signature activities. Can be `asc` or `desc`.  Default is `desc`. | no |

        ### **Response**

        The response contains the following information.

        **General**

        | **Field** | **Description** |
        | --- | --- |
        | `activities` | Array of `activities`. See the following subchapter _Activities_. |
        | `total_items` | Total items to fetch when paginating through all the pages. |
        | `total_pages` | Total pages to fetch when paginating through all the pages. |
        | `current_page` | Current page number. |
        | `size` | Size of the page. |

        **Activities**

        | **Field** | **Description** |
        | --- | --- |
        | `id` | The ID of the signature `activity`. |
        | `action` | The action type of a signature activity. Can be `signed` or `sealed`. |
        | `timestamp` | The timestamp of the signature activity. |
        | `signature_request_id` | The signature request ID. |
        | `cost_center` | The cost center of the signature paying party. This information might not necessarily be present. |
        | `initiator` | The initiator `user` of the signature `activity`. See the following subchapter _User_. |
        | `signer` | The signer `user` of the signature `activity`. See the following subchapter _User_. |

        **User**

        | **Field** | **Description** |
        | --- | --- |
        | `email` | The email of the `user`. |
        | `first_name` | The first name of the `user`. |
        | `last_name` | The last name of the `user`. |
        | `type` | The membership status of the `user` in relation to the business. Can be `api`, `external`, `member` or `unknown`. |
        | `mobile` | The mobile number of the user. |
      operationId: getActivitiesSignaturesByBusiness
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesSignaturesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /management/health:
    get:
      tags:
        - Monitoring
      summary: System Health
      description: |-
        Returns the current health status of the Skribble API. Use this endpoint
        to monitor system availability and responsiveness.

        `status:UP` indicates that the system is operational.
      operationId: getSystemHealth
      security:
        - {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - api-key
      properties:
        username:
          type: string
          description: The username of the users credentials to login
          example: add_your_api_name_here
        api-key:
          type: string
          description: The API key of the users credentials to login
          example: please_enter_your_password_here
    ProblemResponse:
      title: Problem
      type: object
      description: |-
        Error response envelope returned for all 4xx and 5xx responses with a JSON body.
        Follows a Problem+JSON-style shape. The `key` field is optional and only present
        for errors that carry a machine-readable code.
      required:
        - type
        - method
        - path
        - status
        - message
      properties:
        type:
          type: string
          format: uri
          description: |-
            URI identifying the problem category. The host of this URI depends on
            the environment the request was made against (e.g. `api.skribble.com`
            and `api.skribble.de` for the production regions; other environments
            use their respective hosts). Match on the path segment after `/problem/`
            rather than the full URI. Known values:

            - `https://api.skribble.com/problem/problem-with-message` — generic error with a message
            - `https://api.skribble.com/problem/entity-not-found` — requested resource does not exist
            - `https://api.skribble.com/problem/feature-not-enabled` — a required feature is not enabled for the business
            - `https://api.skribble.com/problem/constraint-violation` — request violates a domain constraint
            - `https://api.skribble.com/problem/parameterized` — parameterized error with details
            - `https://api.skribble.com/problem/limit-exceeded` — a usage limit was exceeded
          example: https://api.skribble.com/problem/problem-with-message
        method:
          type: string
          description: HTTP method of the failing request.
          example: POST
        path:
          type: string
          description: Request URI of the failing request.
          example: /v2/signature-requests
        status:
          type: integer
          description: HTTP status code, mirroring the response status line.
          example: 400
        key:
          type: string
          description: |-
            Optional machine-readable error key. Present for a subset of errors that carry
            a stable code. Prefer matching on this field over parsing `message`, which is
            not part of the stable contract.

            Known keys, grouped by category:

            Authentication (`403`):

            - `error.auth.token_expired`: the access token has expired
            - `error.auth.token_invalid`: the access token is malformed or otherwise invalid
            - `error.auth.credentials_invalid`: the supplied credentials were rejected

            Rate limiting (`429`):

            - `error.rate_limit.exceeded`: a generic rate limit was exceeded
            - `error.rate_limit.reminder`: the per-signature-request reminder limit was exceeded

            File upload / attachment (`400`):

            - `file.attachment.unsupported`: the uploaded attachment type is not supported
            - `file.malware.detected`: malware was detected in the uploaded file

            PDF processing (`400`):

            - `file.pdf.general_error`: the PDF could not be loaded (corrupt or unreadable)
            - `file.pdf.encryption.unknown_password`: the PDF is encrypted with an unknown password
            - `file.pdf.encryption.no_changes_allowed`: the PDF's signature permissions (DocMDP) do not allow the required changes
            - `file.pdf.encryption.unknown_permissions`: the PDF is encrypted with an unknown permissions type
            - `file.pdf.signature_verification.failed`: verification of an existing PDF signature failed

            Signature request (`400`):

            - `error.sr.last_document_cannot_be_removed`: the request would remove the only remaining document from the signature request; an SR must keep at least one document
          example: file.attachment.unsupported
        message:
          type: string
          description: Human-readable error message.
          example: Validation failed for JSON object
    SignatureStatusCode_v3:
      title: Signature Status Code
      type: string
      description: |-
        The state of a signature.

        Possible values:
          - **DRAFT** The signature request has not yet been placed.
          - **OPEN** Waiting for the user to sign a signature.
          - **WAITING** The signer is waiting for a preceding signer in the sequence to complete.
          - **DECLINED** The user declined to sign.
          - **WITHDRAWN** The owner has withdrawn the signature request.
          - **SIGNED** The user signed the document.
          - **ERROR** A technical error occurred.
      enum:
        - DRAFT
        - OPEN
        - WAITING
        - DECLINED
        - WITHDRAWN
        - SIGNED
        - ERROR
      example: SIGNED
    SignatureStatusOverall_v3:
      title: Signature Status Overall
      type: string
      description: |-
        Overall signing status of the document.

        Possible values:
          - **DRAFT** The signature request has not yet been placed.
          - **OPEN** At least one user has not signed or declined their signature yet.
          - **DECLINED** At least one user declined to sign. The signature request failed.
          - **WITHDRAWN** The owner has withdrawn the signature request.
          - **SIGNED** All users signed the document. The signature request was successfully completed.
          - **EXPIRED** The owner-set `expires_at` date has passed before all signers signed. Terminal status.
          - **ERROR** A technical error occurred. The signature request cannot be completed.
      enum:
        - DRAFT
        - OPEN
        - DECLINED
        - WITHDRAWN
        - SIGNED
        - EXPIRED
        - ERROR
      example: OPEN
    DocumentInSignatureResponse:
      title: Signature Document Response
      type: object
      properties:
        id:
          type: string
          description: Unique Document ID.
          format: uuid
          example: f1e2d3c4-7b8a-4e6f-9d3b-123456789abc
        name:
          type: string
          description: Document Name.
          example: Filename1.pdf
        version_id:
          type: string
          description: Document Version ID.
          format: uuid
          example: a84f5085-67e5-e106-71c7-69b3d4b7c632
    SignatureLegislation:
      title: Signature Legislation
      type: string
      description: |-
        Legislation under which the signatures are created. Required when `quality` is `QES` or `AES_MINIMAL`.

        | Legislation | Description |
        | --- | --- |
        | **ZERTES** | QES according to Swiss law. This is the **default**. |
        | **EIDAS** | QES according to EU law. |
      enum:
        - ZERTES
        - EIDAS
      example: ZERTES
    SignatureQuality:
      title: Signature Quality
      type: string
      description: |-
        Minimal quality of the signatures for this signature request.

        | Quality | Description |
        | --- | --- |
        | **QES** | Every signer must use QES. This is the **default** quality. Requires a `legislation` parameter. |
        | **AES_MINIMAL** | Signers will use QES if available, otherwise AES. At least AES is guaranteed. Requires a `legislation` parameter. |
        | **AES** | Every signer uses AES. |
        | **SES** | Every signer uses SES. |
        | **DEMO** | Every signer uses a DEMO signature with **no legal binding**. API demo users (`api_demo_example_*`) get this quality by default. |
        | **PART11** | Signers use a signature compliant with 21 CFR Part 11 regulations. |
      enum:
        - SES
        - AES
        - AES_MINIMAL
        - QES
        - DEMO
        - PART11
      example: QES
    VisualSignaturePosition:
      title: Visual Signature Position
      type: object
      properties:
        page:
          type: string
          description: |-
            Page number (0-indexed) where the signature appears.
            This is a String and not a number!
          example: '0'
        height:
          type: number
          description: Height of the signature in pixels.
          example: 70
        width:
          type: number
          description: Width of the signature in pixels.
          example: 150
        x:
          type: number
          description: X-coordinate (pixels from left) of signature.
          example: 350
        'y':
          type: number
          description: Y-coordinate (pixels from top) of signature.
          example: 240
        rotation:
          type: number
          description: |-
            Defines a rotation of the field content. 
            If used in context with a form field, then only the values 0, 90, 180, 270 are legal.
            Otherwise every value is legal. The rotation is applied counter clockwise.
          example: 0
    VisualSignatureImage:
      title: Visual Signature Image
      type: object
      description: Visual signature image.
      required:
        - content
        - content_type
      properties:
        content:
          type: string
          description: Base64 encoded bytes of content.
          format: byte
          example: SGVsbG8gd29ybGQh
        content_type:
          type: string
          description: Content type of bytes sent in content. At the moment this MUST be image/png
          example: image/png
        content_size:
          type: integer
          format: int32
          description: Size of `content` in bytes. Calculated by the server.
          readOnly: true
          example: 3160
    VisualSignature_v3:
      description: Visual signature placement information.
      oneOf:
        - type: object
          title: Multiple Positions
          description: Use multiple explicit positions.
          required:
            - positions
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/VisualSignaturePosition'
            image:
              $ref: '#/components/schemas/VisualSignatureImage'
            position:
              description: Must not be provided when positions are used.
              readOnly: true
            form_field:
              description: Must not be provided when positions are used.
              readOnly: true
        - type: object
          title: Form Field
          description: Use a form field only.
          required:
            - form_field
          properties:
            form_field:
              type: string
              description: |
                Name of the form field in which the signature is placed. If multiple fields of this name are present in the document, all will be used.
            image:
              $ref: '#/components/schemas/VisualSignatureImage'
            position:
              description: Must not be provided when form_field is used.
              readOnly: true
            positions:
              description: Must not be provided when form_field is used.
              readOnly: true
    SignatureDocument:
      title: Signer Document to Sign
      type: object
      properties:
        document_id:
          type: string
          description: Unique Document ID.
          format: uuid
          example: f1e2d3c4-7b8a-4e6f-9d3b-123456789abc
        visual_signature:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/VisualSignature_v3'
    SignatureLanguage:
      title: Signature Language
      type: string
      description: Determines in which language e-mails are sent to the user, if the user has not set their language preference yet.
      enum:
        - en
        - de
        - fr
        - it
      default: en
    SignerIdentityDataResponse:
      title: Signer Identity Data in Response
      type: object
      description: Signer identity information returned as part of the SignatureRequest response.
      properties:
        email_address:
          type: string
          description: Email address of the no-account-signer.
          format: email
          example: nas@example.com
        first_name:
          type: string
          description: First name of the no-account-signer.
          example: John
        last_name:
          type: string
          description: Last name of the no-account-signer.
          example: Doe
        mobile_number:
          type: string
          description: |-
            Mobile number of the no-account-signer in E.164 format without the leading `+`:
            country code + area code + number, no spaces or special characters.
          example: '41791234567'
        language:
          $ref: '#/components/schemas/SignatureLanguage'
        identity_reference:
          type: string
          description: Customer-generated identifier for further identification of the signer.
          example: Internal-ID-012345
        identification_require_evidence:
          type: boolean
          description: If set, a new identification process is started to get fresh evidence records, even if the signer is already identified.
          example: true
        force_standard_qes:
          type: boolean
          description: |-
            If set to `true`, this signer is always identified via the standard QES flow and is never routed
            through Express QES, regardless of the business's Express QES setting or other identity flags such as
            `identification_require_evidence`.
          example: true
        provider:
          type: string
          description: Evidence provider used to verify the signer's identity.
          example: swisscom_ra_app
        evidence_id:
          type: string
          description: |-
            ID of the evidence records created during identification. Populated in the
            `SignatureRequest` response once the identification process has been completed.
          example: '700580648'
    SignatureRecipientResponse_v3:
      title: Signature Callbacks Response
      type: object
      properties:
        sid:
          type: string
          format: uuid
          example: 894a0240-e01a-2307-4376-0267c6a8d105
        account_email:
          type: string
          format: email
          example: you@example.info
        document_signatures:
          type: array
          items:
            $ref: '#/components/schemas/SignatureDocument'
        signer_identity_data:
          $ref: '#/components/schemas/SignerIdentityDataResponse'
        sequence:
          type: integer
          format: int32
          example: -1
        status_code:
          $ref: '#/components/schemas/SignatureStatusCode_v3'
        notify:
          type: boolean
          description: |-
            Whether Skribble sends notification emails to this signer. When set to `false` together with
            `signer_identity_data.identity_reference`, the TAN-based email validation for No-Account-Signers (SES) is skipped.
          example: true
        signing_url:
          type: string
          format: uri
          description: |-
            A personalized signing URL for this specific signer, distinct from the top-level signing_url of the SignatureRequest.
            It points to the Skribble web application and will directly open the document for signing
            provided that the user is known to Skribble and is logged in.
            Otherwise, the user must login or register first to be able to see the document.

            When the user visits this URL, they will be forwarded to a special preview page of the PDF document and can start the signature process as usual.

            You can add the following query parameters to this signing_url. Skribble will respect these parameters and redirect the user to the provided URLs once the signature process is finished.

            Example: `https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e/cd16bd0802d146fd94ff736d7d7bf551?exitURL=https%3A%2F%2Fmy-app.com%2Fsigned&redirectTimeout=10`

            | Parameter | Type | Description |
            | --- | --- | --- |
            | `exitURL` | string (URL-encoded) | Optional URL to redirect after the signature process finished. Example: `https%3A%2F%2Fgoogle.com` |
            | `errorURL` | string (URL-encoded) | Optional URL to redirect in case of an error. Defaults to `exitURL`. Ignored if `exitURL` is not set. Example: `https%3A%2F%2Fbing.com` |
            | `declineURL` | string (URL-encoded) | Optional URL to redirect when the user declines. Defaults to `exitURL`. Ignored if `exitURL` is not set. |
            | `hidedownload` | boolean | Optional flag to hide the download button on the success screen. Requires `exitURL` to be set. Example: `true` |
            | `redirectTimeout` | integer | Optional seconds before auto-redirect after signing. Min 0 (instant), max 90. Default: 45. Example: `20` |
            | `lang` | string | Optional language code to display the signing page in a specific language. Supported values: `en` (default), `de`, `fr`. Example: `lang=fr` |
            | `overlay` | boolean | Optional flag to show or hide the Skribble overlay on the signing page. |
          example: https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e/cd16bd0802d146fd94ff736d7d7bf551
        decline_message:
          type: string
          description: The message provided by the signer when declining the signature request. Only present if the signer declined and provided a message.
        signed_at:
          type: string
          format: date-time
          description: Timestamp when this signer signed the document.
          example: '2025-10-09T12:15:30.000Z'
        signed_legislation:
          $ref: '#/components/schemas/SignatureLegislation'
          description: The legislation under which this signer's signature was created. Only present after signing.
        signed_quality:
          $ref: '#/components/schemas/SignatureQuality'
          description: The actual quality of this signer's signature. Only present after signing.
        last_viewed_at:
          type: string
          format: date-time
          description: Timestamp when this signer last viewed the document.
          example: '2025-10-09T12:10:00.000Z'
        language:
          type: string
          description: Language preference for this signer.
          example: en
        invited_by:
          type: string
          example: api_demo_example
    UserObserverResponse:
      title: User Observer Response
      type: object
      required:
        - id
        - type
        - invited_at
        - invited_by
        - user_info
      properties:
        id:
          type: string
          description: Unique observer identifier.
          example: ob_123
        type:
          type: string
          description: Observer type.
          const: USER
          example: USER
        invited_at:
          type: string
          format: date-time
          description: Timestamp when the observer was invited.
          example: '2026-02-02T12:34:56Z'
        invited_by:
          type: string
          description: Identifier of the user or API key that invited the observer.
          example: api_demo_example
        user_info:
          type: object
          description: Information about the user observer.
          properties:
            id:
              type: string
              description: User ID.
              example: '123'
            email:
              type: string
              format: email
              description: User email address.
              example: you@example.info
    GroupObserverResponse:
      title: Group Observer Response
      type: object
      required:
        - id
        - type
        - invited_at
        - invited_by
        - group_info
      properties:
        id:
          type: string
          description: Unique observer identifier.
          example: ob_456
        type:
          type: string
          description: Observer type.
          const: GROUP
          example: GROUP
        invited_at:
          type: string
          format: date-time
          description: Timestamp when the observer was invited.
          example: '2026-02-02T12:34:56Z'
        invited_by:
          type: string
          description: Identifier of the user or API key that invited the observer.
          example: api_demo_example
        group_info:
          type: object
          description: Information about the group observer.
          required:
            - id
            - name
          properties:
            id:
              type: string
              description: Group ID.
              example: gr_456
            name:
              type: string
              description: Group name.
              example: Group 1
            version_id:
              type: string
              description: Group version identifier.
              example: gv_12
    SignatureObserverResponse:
      description: |-
        Response object representing an observer that has been added to a signature request.

        Depending on the type, either user_info or group_info is present.
      oneOf:
        - $ref: '#/components/schemas/UserObserverResponse'
        - $ref: '#/components/schemas/GroupObserverResponse'
      discriminator:
        propertyName: type
        mapping:
          USER: '#/components/schemas/UserObserverResponse'
          GROUP: '#/components/schemas/GroupObserverResponse'
    SignatureAttachment:
      title: Signature Attachment
      type: object
      properties:
        attachment_id:
          type: string
          format: uuid
          example: 8ed33046-3798-8c54-0b13-0820d0d6e121
        filename:
          type: string
          example: Attachment.pdf
    AttachOnSuccess:
      title: Attachment when signed
      type: array
      description: |-
        When a SignatureRequest has been signed by all signers, all signers and all observers are notified by email.
        Skribble provides the option to attach two types of attachments automatically to this email:
          - the signed document and
          - the signature protocol.

        This can be configured via the business settings, which can be used to define that these documents should generally
        be attached for all SignatureRequests created by business members.

        Alternatively it is possible to define the attachments on demand per SignatureRequest by using this field.
      items:
        type: string
        enum:
          - SIGNED_DOCUMENT
          - SIGNATURE_PROTOCOL
      example:
        - SIGNED_DOCUMENT
        - SIGNATURE_PROTOCOL
    SignatureResponse_v3:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 4f43614a-de50-bfe1-2df3-4c881fc7840e
        title:
          type: string
          example: Example contract
        message:
          type: string
          example: Please sign this document!
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInSignatureResponse'
        legislation:
          $ref: '#/components/schemas/SignatureLegislation'
        quality:
          $ref: '#/components/schemas/SignatureQuality'
        signing_url:
          type: string
          format: uri
          description: The URL for the SignatureRequest owner to view and manage the request in the Skribble web application. This URL is not intended for signers — each signer has their own dedicated signing_url within the signatures array.
          example: https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e
        status_overall:
          $ref: '#/components/schemas/SignatureStatusOverall_v3'
        business_id:
          type: string
          example: biz-42b4c2fb9ee947778ba70bc0698c78f7
        signatures:
          type: array
          items:
            $ref: '#/components/schemas/SignatureRecipientResponse_v3'
        origin:
          type: string
          example: API
        observers:
          type: array
          items:
            $ref: '#/components/schemas/SignatureObserverResponse'
          example: []
        auto_delete_at:
          type: string
          format: date
          description: |-
            Server-managed date on which this signature request and its related documents are automatically
            deleted in line with the owning business's retention policy. Not directly settable by API clients.
            May be absent or `null` when no retention policy applies.
          example: '2026-04-21'
        expires_at:
          type: string
          format: date
          description: |-
            Owner-set expiry date for this signature request. When this date passes, the request
            transitions to `status_overall=EXPIRED`. Set via `expires_at` on create/update;
            clear via `DELETE /signature-requests/{SR_ID}/expires-at`.
            Absent or `null` when no owner-set expiry has been configured.
          example: '2026-12-31'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/SignatureAttachment'
          example: []
        attach_on_success:
          $ref: '#/components/schemas/AttachOnSuccess'
        custom:
          type: string
          description: Custom field for storing application-specific data related to this signature request.
          example: MyCustomvalue1,MyVal2
        owner:
          type: string
          example: api_demo_example
        read_access:
          type: array
          description: Users or API keys with read access to this signature request.
          items:
            type: string
          example:
            - persononetosign@external.net
            - api_demo_example
            - you@example.info
            - persontwotosign@external.net
        write_access:
          type: array
          description: Users or API keys with write access to this signature request.
          items:
            type: string
          example:
            - api_demo_example
        created_at:
          type: string
          format: date-time
          example: '2025-10-08T17:37:03.569Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-10-08T17:37:03.569Z'
        initiated_at:
          type: string
          format: date-time
          example: '2025-10-08T17:37:03.569Z'
        callback_success_url:
          type: string
          description: Callback URL called on overall success. See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/success
        callback_error_url:
          type: string
          description: Callback URL called when a signer declines or the request is withdrawn. See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/error
        callback_update_url:
          type: string
          description: Callback URL called on any update (e.g. one signer signed). See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/update
        callback_start_sign_url:
          type: string
          description: Callback URL called when a signer starts the signature process (only for Express QES). See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/start-sign
        callback_ident_pending_url:
          type: string
          description: Callback URL called when the identification of a signer requires manual review. See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/ident-pending
        callback_ident_error_url:
          type: string
          description: Callback URL called when the identification of a signer ends in an error. See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/ident-error
    SignerIdentityData:
      title: Signer Identity Data
      type: object
      description: Optional (no-account) signer identity information.
      properties:
        email_address:
          type: string
          format: email
          description: Email address of no-account-signer. Mandatory when `quality` is `SES`.
          example: no-account@skribble.com
        first_name:
          type: string
          description: First name of no-account-signer
          example: John
        last_name:
          type: string
          description: Last name of no-account-signer
          example: Doe
        mobile_number:
          type: string
          description: |-
            Mobile number of the no-account-signer in E.164 format without the leading `+`:
            country code + area code + number, no spaces or special characters.
          example: '41791234567'
        language:
          $ref: '#/components/schemas/SignatureLanguage'
        provider:
          type: string
          description: Evidence provider where Skribble can verify the signer's identity data.
          example: some-provider
        identity_reference:
          type: string
          description: |-
            Optional customer-generated identifier for further identification. When set together with `notify: false`,
            the TAN-based email validation for No-Account-Signers (SES) is skipped, allowing signers to sign directly
            without the Skribble TAN process.
          example: Internal-ID-012345
        identification_require_evidence:
          type: boolean
          description: |-
            (optional) if set, even if the signer is already identified, a new identification process is started to get fresh evidence records.
            Only supported when the signature request's quality is `QES` and Express QES is enabled for the business;
            otherwise the request fails with a validation error.
          example: true
        force_standard_qes:
          type: boolean
          description: |-
            (optional) if set to `true`, this signer is always identified via the standard QES flow and is never routed
            through Express QES, regardless of the business's Express QES setting or other identity flags such as
            `identification_require_evidence`.
          example: true
    SignatureRecipient:
      description: |-
        Defines a signature recipient which can either be an individual signer or a group signer.

        - For individual signers, account_email and/or signer_identity_data can optionally be provided.
        - For group signers, signer_group_id must be provided and account_email/signer_identity_data must not be used.
      oneOf:
        - title: User Signer
          type: object
          additionalProperties: false
          properties:
            sequence:
              type: number
              description: Optional signing order for this signer, starting at `1`. If no sequence is supplied, signers can sign in any order. When a number is set, Skribble enforces an ascending signing order across all signers, based on their `sequence` values.
              format: int32
              default: -1
              example: 1
            notify:
              type: boolean
              description: Whether to send a notification to this signer.
              default: true
              example: false
            document_signatures:
              type: array
              description: Visual signatures to place on the document.
              items:
                $ref: '#/components/schemas/SignatureDocument'
            account_email:
              type: string
              description: Optional signer account email address.
              format: email
              example: you@example.info
            signer_identity_data:
              $ref: '#/components/schemas/SignerIdentityData'
        - title: Group Signer
          type: object
          additionalProperties: false
          required:
            - signer_group_id
          properties:
            sequence:
              type: number
              description: Optional signing order for this signer, starting at `1`. If no sequence is supplied, signers can sign in any order. When a number is set, Skribble enforces an ascending signing order across all signers, based on their `sequence` values.
              format: int32
              default: -1
              example: 1
            notify:
              type: boolean
              description: Whether to send a notification to this signer.
              default: true
              example: false
            document_signatures:
              type: array
              description: Visual signatures to place on the document.
              items:
                $ref: '#/components/schemas/SignatureDocument'
            signer_group_id:
              type: string
              description: Signer group ID.
              example: gr_9feb51ba97444c539261b64294f33225
    UpdateSignatureRequest:
      title: Update Signature Request
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Unique ID of the signature request.
          format: uuid
          example: 4f43614a-de50-bfe1-2df3-4c881fc7840e
        title:
          type: string
          description: Title of the signature request.
          example: Example contract
        message:
          type: string
          description: Message sent to the other participants along with this signature request.
          example: Please sign this document!
        legislation:
          $ref: '#/components/schemas/SignatureLegislation'
        quality:
          $ref: '#/components/schemas/SignatureQuality'
        signatures:
          oneOf:
            - type: 'null'
              title: No signers
            - type: array
              title: Signers
              description: List of recipients required to sign the document.
              items:
                $ref: '#/components/schemas/SignatureRecipient'
        callback_success_url:
          type: string
          description: Callback-URL which is called on overall success.
          format: uri
          example: https://mybiz.com/call/success
        callback_error_url:
          type: string
          description: Callback-URL which is called in case of an error.
          format: uri
          example: https://mybiz.com/call/success
        callback_update_url:
          type: string
          description: Callback-URL which is called in case of an update.
          format: uri
          example: https://mybiz.com/call/success
        callback_start_sign_url:
          type: string
          description: Callback-URL which is called when a signer starts the signature process (only for Express QES).
          format: uri
          example: https://mybiz.com/call/start-sign
        callback_ident_pending_url:
          type: string
          description: Callback-URL which is called when the identification of a signer requires manual review.
          format: uri
          example: https://mybiz.com/call/ident-pending
        callback_ident_error_url:
          type: string
          description: Callback-URL which is called when the identification of a signer ends in an error.
          format: uri
          example: https://mybiz.com/call/ident-error
        attach_on_success:
          oneOf:
            - type: 'null'
              title: No update
            - $ref: '#/components/schemas/AttachOnSuccess'
        expires_at:
          type: string
          format: date
          description: |-
            **Early access.** This field is available to opted-in businesses only. To request
            access, contact [support@skribble.com](mailto:support@skribble.com).

            Setting `expires_at` requires the signature-request expiry feature to be enabled
            for the business. If it is not, the request fails with `403 Forbidden`
            (problem type `feature-not-enabled`).

            Owner-set expiry date for this signature request (ISO 8601 date, e.g. `2026-12-31`).

            When set, the `SignatureRequest` transitions to `status_overall=EXPIRED` at the end of the
            given day if it has not been completed. `EXPIRED` is a terminal status.

            To clear an existing expiry date, call `DELETE /signature-requests/{SR_ID}/expires-at`.

            **Constraints**

            - Must be today or later.
            - Must be at most 6 months in the future.
            - If the owning business has a retention policy configured, `expires_at` must be at most
              one day before the configured retention deletion date.
            - Mutable on `status_overall=DRAFT` only. Updating on a non-`DRAFT` request returns
              `400 Bad Request`.
          example: '2026-12-31'
        write_access:
          oneOf:
            - type: 'null'
              title: No update
            - type: array
              title: Specific write access
              description: Users or API keys with write access to this signature request.
              items:
                type: string
              example:
                - api_demo_example
    DocumentInSignature:
      title: Signature Document
      type: object
      properties:
        id:
          type: string
          description: Unique Document ID.
          format: uuid
          example: f1e2d3c4-7b8a-4e6f-9d3b-123456789abc
    CreateSignatureRequest:
      title: Create Signature Request
      type: object
      required:
        - title
        - documents
      properties:
        title:
          type: string
          description: Title of the signature request.
          example: Example contract
        message:
          type: string
          description: Message sent to the other participants along with this signature request.
          example: Please sign this document!
        legislation:
          $ref: '#/components/schemas/SignatureLegislation'
        quality:
          $ref: '#/components/schemas/SignatureQuality'
        documents:
          type: array
          description: List of documents to be signed (Maximum 50).
          maxItems: 50
          items:
            $ref: '#/components/schemas/DocumentInSignature'
        signatures:
          oneOf:
            - type: 'null'
              title: No signers
            - type: array
              title: Signers
              description: |-
                List of recipients required to sign the document. Each entry is either a User Signer or a Group Signer.

                **User Signers**

                It is possible to create a SignatureRequest where one or more invited participants won't need a
                Skribble account to sign the SignatureRequest. Those signers are called No-Account-Signers (NAS).

                To invite a No-Account-Signer (NAS), include an entry in the signatures array without an
                `account_email` and provide the signer's details using `signer_identity_data` instead.

                Each entry in the signatures array will be treated as a distinct identity. This means two entries
                with the same `signer_identity_data` are treated as two different identities and require that this
                person signs the document twice.

                Optionally you can combine `signer_identity_data` and `account_email` in your requests. In this case,
                the system checks first if there is a Skribble account with the specified e-mail address.
                If one is found the existing Skribble user will be invited to sign the document. Otherwise, the
                specified user in `signer_identity_data` will be invited to sign.

                > **Good to know**
                > We recommend combining `signer_identity_data` and `account_email` if you are unsure whether the
                > user has a Skribble account.
                > The benefit is that an existing Skribble user will afterwards find the SignatureRequest in the
                > "To sign" section of their account on my.skribble.com.
                > Conversely, if you invite them using only `signer_identity_data`, the document will not appear in
                > their Skribble account, even if they have one. Instead, they will have to access the document
                > using the specific link provided in their signature invitation email.

                Missing fields like first name and last name can easily be adjusted by the signer through the
                Skribble web client.

                **Group Signers**

                Instead of a specific individual, you can invite a signer group by providing a `signer_group_id`.
                One member of the group will then be required to sign the document. `account_email` and
                `signer_identity_data` must not be used when specifying a group signer.

                > **Note:** To retrieve a group ID, go to the Admin UI, open Group Management, and use the
                > copy option next to the group to copy its ID.
              items:
                $ref: '#/components/schemas/SignatureRecipient'
        callback_success_url:
          type: string
          description: |-
            Callback URL called via POST when all signers have signed (overall success).

            The URL supports the following placeholders, replaced with current SignatureRequest data before each call:
            - `SKRIBBLE_SIGNATURE_REQUEST_ID` — the SignatureRequest ID
            - `SKRIBBLE_DOCUMENT_ID` — the final signed document ID

            **Retry:** If the endpoint is unreachable, Skribble retries every 10 minutes for up to 2 hours.
            The endpoint can return a `Retry-After` header (seconds) to control the retry interval.
          format: uri
          example: https://mybiz.com/call/success?sr=SKRIBBLE_SIGNATURE_REQUEST_ID
        callback_error_url:
          type: string
          description: |-
            Callback URL called via POST when a signer declines or the SignatureRequest is withdrawn.

            The URL supports the following placeholders, replaced with current SignatureRequest data before each call:
            - `SKRIBBLE_SIGNATURE_REQUEST_ID` — the SignatureRequest ID
            - `SKRIBBLE_DOCUMENT_ID` — the most recent document ID

            **Retry:** If the endpoint is unreachable, Skribble retries every 10 minutes for up to 2 hours.
            The endpoint can return a `Retry-After` header (seconds) to control the retry interval.
          format: uri
          example: https://mybiz.com/call/error?sr=SKRIBBLE_SIGNATURE_REQUEST_ID
        callback_update_url:
          type: string
          description: |-
            Callback URL called via POST on any change to the SignatureRequest (e.g. one signer has signed).

            The URL supports the following placeholders, replaced with current SignatureRequest data before each call:
            - `SKRIBBLE_SIGNATURE_REQUEST_ID` — the SignatureRequest ID
            - `SKRIBBLE_DOCUMENT_ID` — the most recent document ID
            - `SKRIBBLE_SIGNATURE_ID` — the Signature ID (SID) of the signature just made

            **Retry:** If the endpoint is unreachable, Skribble retries every 10 minutes for up to 2 hours.
            The endpoint can return a `Retry-After` header (seconds) to control the retry interval.
          format: uri
          example: https://mybiz.com/call/update?sr=SKRIBBLE_SIGNATURE_REQUEST_ID&sig=SKRIBBLE_SIGNATURE_ID
        callback_start_sign_url:
          type: string
          description: |-
            Callback URL called via POST when a signer starts the signature process (only for Express QES).

            The URL supports the following placeholders, replaced with current SignatureRequest data before each call:
            - `SKRIBBLE_SIGNATURE_REQUEST_ID` — the SignatureRequest ID
            - `SKRIBBLE_DOCUMENT_ID` — the most recent document ID

            **Retry:** If the endpoint is unreachable, Skribble retries every 10 minutes for up to 2 hours.
            The endpoint can return a `Retry-After` header (seconds) to control the retry interval.
          format: uri
          example: https://mybiz.com/call/start-sign?sr=SKRIBBLE_SIGNATURE_REQUEST_ID
        callback_ident_pending_url:
          type: string
          description: |-
            Callback URL called via POST when the identification of a signer requires manual review.

            The URL supports the following placeholders, replaced with current SignatureRequest data before each call:
            - `SKRIBBLE_SIGNATURE_REQUEST_ID` — the SignatureRequest ID
            - `SKRIBBLE_DOCUMENT_ID` — the most recent document ID

            **Retry:** If the endpoint is unreachable, Skribble retries every 10 minutes for up to 2 hours.
            The endpoint can return a `Retry-After` header (seconds) to control the retry interval.
          format: uri
          example: https://mybiz.com/call/ident-pending?sr=SKRIBBLE_SIGNATURE_REQUEST_ID
        callback_ident_error_url:
          type: string
          description: |-
            Callback URL called via POST when the identification of a signer ends in an error.

            The URL supports the following placeholders, replaced with current SignatureRequest data before each call:
            - `SKRIBBLE_SIGNATURE_REQUEST_ID` — the SignatureRequest ID
            - `SKRIBBLE_DOCUMENT_ID` — the most recent document ID

            **Retry:** If the endpoint is unreachable, Skribble retries every 10 minutes for up to 2 hours.
            The endpoint can return a `Retry-After` header (seconds) to control the retry interval.
          format: uri
          example: https://mybiz.com/call/ident-error?sr=SKRIBBLE_SIGNATURE_REQUEST_ID
        custom:
          type: string
          description: Custom field for storing application-specific data related to this signature request.
          example: MyCustomvalue1,MyVal2
        expires_at:
          type: string
          format: date
          description: |-
            **Early access.** This field is available to opted-in businesses only. To request
            access, contact [support@skribble.com](mailto:support@skribble.com).

            Setting `expires_at` requires the signature-request expiry feature to be enabled
            for the business. If it is not, the request fails with `403 Forbidden`
            (problem type `feature-not-enabled`).

            Owner-set expiry date for this signature request (ISO 8601 date, e.g. `2026-12-31`).

            When set, the `SignatureRequest` transitions to `status_overall=EXPIRED` at the end of the
            given day if it has not been completed. `EXPIRED` is a terminal status.

            **Constraints**

            - Must be today or later.
            - Must be at most 6 months in the future.
            - If the owning business has a retention policy configured, `expires_at` must be at most
              one day before the configured retention deletion date.
            - Only settable while `status_overall=DRAFT`.

            Omit or send `null` to leave the request without an owner-set expiry.
          example: '2026-12-31'
        attach_on_success:
          oneOf:
            - type: 'null'
              title: No attachment when signed
            - $ref: '#/components/schemas/AttachOnSuccess'
        creator:
          oneOf:
            - type: 'null'
              title: No owner
            - type: string
              title: Specific owner
              description: Set a business member as the owner of this signature request, in addition to the API user.
              format: email
              example: some-member-of@your-business.com
        write_access:
          oneOf:
            - type: 'null'
              title: No other writer
            - type: array
              title: Additional writer
              description: Users or API keys with write access to this signature request.
              items:
                type: string
                format: email
              example:
                - john.doe@skribble.com
                - jane.doe@skribble.com
    SignatureStatusOverall:
      title: Signature Status Overall
      type: string
      description: |-
        Overall signing status of the document.

        Possible values:
          - **OPEN** At least one user has not signed or declined their signature yet.
          - **DECLINED** At least one user declined to sign. The signature request failed.
          - **WITHDRAWN** The owner has withdrawn the signature request.
          - **SIGNED** All users signed the document. The signature request was successfully completed.
          - **EXPIRED** The owner-set `expires_at` date has passed before all signers signed. Terminal status.
          - **ERROR** A technical error occurred. The signature request cannot be completed.
      enum:
        - OPEN
        - DECLINED
        - WITHDRAWN
        - SIGNED
        - EXPIRED
        - ERROR
      example: OPEN
    SignatureStatusCode:
      title: Signature Status Code
      type: string
      description: |-
        The state of a signature.

        Possible values:
          - **OPEN** Waiting for the user to sign a signature.
          - **WAITING** The signer is waiting for a preceding signer in the sequence to complete.
          - **DECLINED** The user declined to sign.
          - **WITHDRAWN** The owner has withdrawn the signature request.
          - **SIGNED** The user signed the document.
          - **ERROR** A technical error occurred.
      enum:
        - OPEN
        - WAITING
        - DECLINED
        - WITHDRAWN
        - SIGNED
        - ERROR
      example: SIGNED
    VisualSignatureResponse:
      title: Visual Signature Response
      type: object
      description: Visual signature placement information.
      properties:
        image:
          $ref: '#/components/schemas/VisualSignatureImage'
        position:
          description: Position where the signature should appear.
          $ref: '#/components/schemas/VisualSignaturePosition'
        positions:
          type: array
          description: List of additional positions where the signature should appear.
          items:
            $ref: '#/components/schemas/VisualSignaturePosition'
        form_field:
          type: string
          description: |
            Name of the form field in which the signature is placed. If multiple fields of this name are present in the document, all will be used. Takes precedence before positions.
          example: Signature1
        text:
          type: object
          description: Text displayed inside the form field.
          properties:
            content:
              type: string
              description: Content of the text field.
              example: Customer Signature
            font_name:
              type: string
              description: |
                Font name used. For PDF: all default PDF fonts or fonts already embedded in the document.
              example: Helvetica-Bold
            font_size:
              type: string
              description: Font size used.
              example: '12'
            font_color:
              type: string
              description: Font color as RGB value encoded in hex.
              example: '#ff0000'
    SignatureRecipientResponse:
      title: Signature Callbacks Response
      type: object
      properties:
        sid:
          type: string
          format: uuid
          example: 894a0240-e01a-2307-4376-0267c6a8d105
        status_code:
          $ref: '#/components/schemas/SignatureStatusCode'
        account_email:
          type: string
          format: email
          example: you@example.info
        signer_identity_data:
          $ref: '#/components/schemas/SignerIdentityDataResponse'
        sequence:
          type: integer
          format: int32
          example: -1
        notify:
          type: boolean
          description: |-
            Whether Skribble sends notification emails to this signer. When set to `false` together with
            `signer_identity_data.identity_reference`, the TAN-based email validation for No-Account-Signers (SES) is skipped.
          example: true
        signing_url:
          type: string
          format: uri
          description: |-
            A personalized signing URL for this specific signer, distinct from the top-level signing_url of the SignatureRequest.
            It points to the Skribble web application and will directly open the document for signing
            provided that the user is known to Skribble and is logged in.
            Otherwise, the user must login or register first to be able to see the document.

            When the user visits this URL, they will be forwarded to a special preview page of the PDF document and can start the signature process as usual.

            You can add the following query parameters to this signing_url. Skribble will respect these parameters and redirect the user to the provided URLs once the signature process is finished.

            Example: `https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e/cd16bd0802d146fd94ff736d7d7bf551?exitURL=https%3A%2F%2Fmy-app.com%2Fsigned&redirectTimeout=10`

            | Parameter | Type | Description |
            | --- | --- | --- |
            | `exitURL` | string (URL-encoded) | Optional URL to redirect after the signature process finished. Example: `https%3A%2F%2Fgoogle.com` |
            | `errorURL` | string (URL-encoded) | Optional URL to redirect in case of an error. Defaults to `exitURL`. Ignored if `exitURL` is not set. Example: `https%3A%2F%2Fbing.com` |
            | `declineURL` | string (URL-encoded) | Optional URL to redirect when the user declines. Defaults to `exitURL`. Ignored if `exitURL` is not set. |
            | `hidedownload` | boolean | Optional flag to hide the download button on the success screen. Requires `exitURL` to be set. Example: `true` |
            | `redirectTimeout` | integer | Optional seconds before auto-redirect after signing. Min 0 (instant), max 90. Default: 45. Example: `20` |
            | `lang` | string | Optional language code to display the signing page in a specific language. Supported values: `en` (default), `de`, `fr`. Example: `lang=fr` |
            | `overlay` | boolean | Optional flag to show or hide the Skribble overlay on the signing page. |
          example: https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e/cd16bd0802d146fd94ff736d7d7bf551
        decline_message:
          type: string
          description: The message provided by the signer when declining the signature request. Only present if the signer declined and provided a message.
        signed_at:
          type: string
          format: date-time
          description: Timestamp when this signer signed the document.
          example: '2025-10-09T12:15:30.000Z'
        signed_legislation:
          $ref: '#/components/schemas/SignatureLegislation'
          description: The legislation under which this signer's signature was created. Only present after signing.
        signed_quality:
          $ref: '#/components/schemas/SignatureQuality'
          description: The actual quality of this signer's signature. Only present after signing.
        last_viewed_at:
          type: string
          format: date-time
          description: Timestamp when this signer last viewed the document.
          example: '2025-10-09T12:10:00.000Z'
        language:
          type: string
          description: Language preference for this signer.
          example: en
        visual_signature:
          $ref: '#/components/schemas/VisualSignatureResponse'
    SignatureResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 4f43614a-de50-bfe1-2df3-4c881fc7840e
        title:
          type: string
          example: Example contract
        message:
          type: string
