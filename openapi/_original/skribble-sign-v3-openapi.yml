            format: uri
            example: http://ext-service:8080/callback_success
          attempts:
            type: integer
            description: The attempts this callback was carried out.
            format: int32
            example: 1
          messages:
            type: array
            description: Error messages in case that the callback failed.
            items:
              type: string
              description: HTTP response message in case that the API did not receive a HTTP 2xx success code.
            example:
              - Failed 404
              - Failed 500
          owner:
            deprecated: true
            type: string
            description: E-mail address of the object owner.
            example: api@company.com
          read_access:
            deprecated: true
            type: array
            description: Users or API keys with read access to the object.
            items:
              type: string
            example:
              - api_demo_example
          write_access:
            deprecated: true
            type: array
            description: Users or API keys with write access to the object.
            items:
              type: string
            example:
              - api_demo_example
          created_at:
            type: string
            description: The time at which the object was created.
            format: date-time
            example: '2025-10-08T17:37:03.569Z'
          updated_at:
            type: string
            description: The time at which the object was last changed.
            format: date-time
            example: '2025-10-08T17:37:03.569Z'
