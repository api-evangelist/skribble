  parameters:
    quality:
      name: quality
      required: false
      in: query
      description: |-
        Optional flag specifying the minimum signature quality required (SES, AES,
        QES).
      schema:
        type: string
        enum:
          - SES
          - AES
          - QES
    preservation:
      name: longTermValidation
      in: query
      required: false
      description: Optional flag indicating whether the signature must be long-term valid.
      schema:
        type: boolean
    legislation:
      name: legislation
      in: query
      required: false
      description: |-
        Optional jurisdiction (legal framework) the signature must satisfy:
        `CH` = Swiss law (ZertES), `EU` = EU law (eIDAS Regulation), `CH_EU` = both
        ZertES and eIDAS, `WORLD` = no specific jurisdiction (international). When set,
        the validation reports whether the signature meets the selected framework.
      schema:
        type: string
        enum:
          - WORLD
          - CH
          - EU
          - CH_EU
    additionalInfos:
      name: infos
      in: query
      required: false
      description: |-
        Optional flag to request additional information, such as validation, format,
        or signer details.
      schema:
        type: array
        items:
          type: string
          enum:
            - validation
            - format
            - signer
    rejectVisualDifferences:
      name: rejectVisualDifferences
      in: query
      required: false
      description: |-
        Optional flag to specify if visual differences should be rejected. If 'true',
        validation will fail due to visual differences; if 'false' or not provided,
        visual differences will not cause validation to fail.
      schema:
        type: boolean
    rejectUndefinedChanges:
      name: rejectUndefinedChanges
      in: query
      required: false
      description: |-
        Optional flag to specify if undefined changes should be rejected. If 'true',
        validation will fail due to undefined changes; if 'false' or not provided,
        undefined changes will not cause validation to fail.
      schema:
        type: boolean
    validateid:
      name: id
      in: path
      required: true
      description: The 'id' provided by the validate operation
      schema:
        type: string
        format: uuid
        default: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    reportlang:
      name: lang
      in: query
      description: Language of the validation report
      required: false
      schema:
        type: string
        enum:
          - en
          - de
          - fr
        default: en
    reportattachetsi:
      name: attachETSIReport
      in: query
      description: Attach the ETSI TS 119 102-2 XML validation report as a file attachment to the PDF. When enabled, the XML report is embedded in the PDF and a paperclip annotation is added on the last page. This registers additional usage for the ETSI report endpoint.
      required: false
      schema:
        type: boolean
        default: false
    reporttimezone:
      name: timeZone
      in: query
      description: IANA timezone name used to render timestamps in the report — the "Generated at" time and each signer's "Time of signature". Defaults to UTC, preserving the previous behaviour when omitted. The rendered zone abbreviation (e.g. `UTC`, `CET`, `PST`) reflects the chosen zone. Browser callers can pass `Intl.DateTimeFormat().resolvedOptions().timeZone`. The timezone is part of the report cache key, so each distinct timezone (per language and ETSI flag) is rendered, billed and cached once. An unknown or malformed value returns `400`.
      required: false
      schema:
        type: string
        default: UTC
        example: Europe/Zurich
