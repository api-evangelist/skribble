    VisualSignature:
      description: Visual signature placement information.
      oneOf:
      - type: object
        title: Single Position
        description: Use a single explicit position.
        required:
        - position
        properties:
          position:
            $ref: '#/components/schemas/VisualSignaturePosition'
          image:
            $ref: '#/components/schemas/VisualSignatureImage'
          positions:
            description: Must not be provided when position is used.
            readOnly: true
          form_field:
            description: Must not be provided when position is used.
            readOnly: true
      - type: object
        title: Multiple Positions
        description: Use multiple explicit positions.
        required:
        - positions
        properties:
          positions:
            type: array
            items:
              $ref: '#/components/schemas/VisualSignaturePosition'
          image:
            $ref: '#/components/schemas/VisualSignatureImage'
          position:
            description: Must not be provided when positions are used.
            readOnly: true
          form_field:
            description: Must not be provided when positions are used.
            readOnly: true
      - type: object
        title: Form Field
        description: Use a form field only.
        required:
        - form_field
        properties:
          form_field:
            type: string
            description: 'Name of the form field in which the signature is placed. If multiple fields of this name are present in the document, all will be used.

              '
          text:
            type: object
            description: Optional text to display inside the form field.
            properties:
              content:
                type: string
                description: Content of the text field.
                example: Customer Signature
              font_name:
                type: string
                description: 'Font name to use. It is just a suggestion. For PDF: all default PDF fonts can be used or fonts which are already embedded in the document. If not specified, the default font of the form field will be used.

                  '
                example: Helvetica-Bold
              font_size:
                type: string
                description: Font size to use. If not specified, the default size for the form field will be used.
                example: '12'
              font_color:
                type: string
                description: Font color to use as RGB value encoded in hex. Defaults to black (#000000).
                example: '#ff0000'
          image:
            $ref: '#/components/schemas/VisualSignatureImage'
          position:
            description: Must not be provided when form_field is used.
            readOnly: true
          positions:
            description: Must not be provided when form_field is used.
            readOnly: true
    SignatureRecipient_2:
      title: Signature Recipient
      type: object
      properties:
        account_email:
          type: string
          description: Optional signer account email address.
          format: email
          example: you@example.info
        sequence:
          type: number
          description: Optional signing order for this signer, starting at `1`. If no sequence is supplied, signers can sign in any order. When a number is set, Skribble enforces an ascending signing order across all signers, based on their `sequence` values.
          format: int32
          default: -1
          example: 1
        notify:
          type: boolean
          description: Whether to send a notification to this signer.
          default: true
          example: false
        language:
          $ref: '#/components/schemas/SignatureLanguage'
        signer_identity_data:
          $ref: '#/components/schemas/SignerIdentityData'
        visual_signature:
          $ref: '#/components/schemas/VisualSignature'
    CreateSignatureRequest_2:
      title: Create Signature Request
      oneOf:
      - title: Base64 Content
        description: Provide the document as Base64-encoded content.
        allOf:
        - type: object
          required:
          - content
          properties:
            content:
              type: string
              format: byte
              description: Base64 encoded bytes of the document. Maximum document size is **112.5 MB** unencoded (**150 MB** Base64-encoded).
              example: SGVsbG8gd29ybGQh
            content_type:
              type: string
              description: Content type of bytes sent in content. Currently, only application/pdf is supported.
              example: application/pdf
        - $ref: '#/components/schemas/CreateSignatureRequestBase'
      - title: File URL
        description: Provide a publicly accessible URL for the document.
        allOf:
        - type: object
          required:
          - file_url
          properties:
            file_url:
              type: string
              format: uri
              description: Publicly accessible URL for document download.
              example: https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf
        - $ref: '#/components/schemas/CreateSignatureRequestBase'
      - title: Document ID
        description: Reference an existing document already uploaded to Skribble.
        allOf:
        - type: object
          required:
          - document_id
          properties:
            document_id:
              type: string
              description: Document ID of an existing document on Skribble.
              example: 3648f61d-4194-455c-a0bc-1c438d2cd11b
        - $ref: '#/components/schemas/CreateSignatureRequestBase'
  responses:
    NotAcceptable:
      description: Not acceptable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            type: https://api.skribble.com/problem/problem-with-message
            method: POST
            path: /v2/signature-requests
            status: 406
            message: Content type not supported
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            type: https://api.skribble.com/problem/entity-not-found
            method: GET
            path: /v2/signature-requests/00000000-0000-0000-0000-000000000000
            status: 404
            message: SignatureRequest not found
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            type: https://api.skribble.com/problem/problem-with-message
            method: GET
            path: /v2/signature-requests/4f43614a-de50-bfe1-2df3-4c881fc7840e
            status: 403
            message: Access denied
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            type: https://api.skribble.com/problem/problem-with-message
            method: GET
            path: /v2/signature-requests
            status: 401
            message: Unauthorized
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            type: https://api.skribble.com/problem/problem-with-message
            method: POST
            path: /v2/signature-requests
            status: 500
            message: Internal server error
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            type: https://api.skribble.com/problem/problem-with-message
            method: POST
            path: /v2/signature-requests
            status: 400
            message: Validation failed for JSON object
    FeatureNotEnabled:
      description: 'The requested operation depends on a feature that is not enabled for the

        business. The response carries the problem type

        `https://api.skribble.com/problem/feature-not-enabled`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            type: https://api.skribble.com/problem/feature-not-enabled
            method: POST
            path: /v2/signature-requests
            status: 403
            message: '''expires_at'' is not supported. Feature is not enabled.'
    ForbiddenOrPayloadTooLarge:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          examples:
            AccessDenied:
              value:
                type: https://api.skribble.com/problem/problem-with-message
                method: GET
                path: /v2/signature-requests/4f43614a-de50-bfe1-2df3-4c881fc7840e
                status: 403
                message: Access denied
            FeatureNotEnabled:
              value:
                type: https://api.skribble.com/problem/feature-not-enabled
                method: POST
                path: /v2/signature-requests
                status: 403
                message: '''expires_at'' is not supported. Feature is not enabled.'
        text/plain:
          schema:
            $ref: '#/components/schemas/PayloadTooLarge'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            type: https://api.skribble.com/problem/problem-with-message
            method: POST
            path: /v2/signature-requests
            status: 429
            message: Too many requests
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
