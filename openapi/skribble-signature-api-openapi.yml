openapi: 3.2.0
info:
  title: Skribble Signature API
  contact:
    name: Skribble Engineering
    url: https://skribble.com
    email: support@skribble.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.skribble.com/en-eu/terms-of-use/
  version: '1.0'
  description: 'Operations tagged Signature across 3 of this provider''s published API definitions: skribble-sign-v3-openapi.yml, skribble-sign-v2-openapi.yml, skribble-sign-v3-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.skribble.com/v3
  description: Production - Switzerland
- url: https://api.skribble.de/v3
  description: Production - Germany
- url: https://api.skribble.com/v2
  description: Production - Switzerland
- url: https://api.skribble.de/v2
  description: Production - Germany
security: []
tags:
- name: Signature
  description: Endpoints for creating and managing signature requests.
paths:
  /signature-requests:
    post:
      tags:
      - Signature
      summary: Create a Signature Request
      description: 'Creates a new `SignatureRequest`, which is the primary object of the Skribble API.

        A `SignatureRequest` defines who signs what and under which conditions. It specifies

        the documents to be signed, the list of required signers, the desired signature quality

        and legislation, and optional settings such as signing sequences, callback URLs, and

        access control.


        Compared to API v2, this version supports attaching multiple documents to a single

        `SignatureRequest`. Additionally, the request no longer triggers invitations immediately.

        Instead, the `SignatureRequest` is created with a `status_overall` of `DRAFT`.


        If you specify an owner using the `creator` field, that user will find the request in

        the Drafts section of their account, where they can review and complete the setup.


        Once ready, call `/initiate` to start the `SignatureRequest` and send out invitations.'
      operationId: createSignatureRequest
      security:
      - bearer: []
      requestBody:
        description: Request body to create a SignatureRequest object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignatureRequest'
            examples:
              OneSignerOneDoc:
                $ref: '#/components/examples/OneSignerOneDoc'
              OneSignerMultiDoc:
                $ref: '#/components/examples/OneSignerMultiDoc'
              MultiSignerMultiDoc:
                $ref: '#/components/examples/MultiSignerMultiDoc'
              NASfirst:
                $ref: '#/components/examples/NASfirst'
              SignerGroup:
                $ref: '#/components/examples/SignerGroup'
              Callbacks:
                $ref: '#/components/examples/Callbacks'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureResponse_v3'
              examples:
                Sample1:
                  $ref: '#/components/examples/Sample1'
                Sample2:
                  $ref: '#/components/examples/Sample2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FeatureNotEnabled'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    servers:
    - url: https://api.skribble.com/v3
      description: Production - Switzerland
    - url: https://api.skribble.de/v3
      description: Production - Germany
  /signature-requests/{SR_ID}/initiate:
    post:
      tags:
      - Signature
      summary: Invite signers and start signing process
      description: 'Starts the signing process for a `SignatureRequest` in `DRAFT` status.


        This action sends out invitation emails and transitions `status_overall`

        from `DRAFT` to `OPEN`. Once initiated, the `SignatureRequest` is no longer

        visible in the Drafts section and will appear in the appropriate section

        (e.g. Pending) for each participant.'
      operationId: initiateSignatureRequest
      security:
      - bearer: []
      parameters:
      - $ref: '#/components/parameters/SignatureIDPath'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    servers:
    - url: https://api.skribble.com/v3
      description: Production - Switzerland
    - url: https://api.skribble.de/v3
      description: Production - Germany
  /signature-requests/{SR_ID}:
    get:
      tags:
      - Signature
      summary: Get a Signature Request
      description: Fetches a `SignatureRequest` by its ID.
      operationId: getSignatureRequestDetails
      security:
      - bearer: []
      parameters:
      - $ref: '#/components/parameters/SignatureIDPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureResponse_v3'
              examples:
                SampleSimple:
                  $ref: '#/components/examples/SampleSimple'
                SampleObservers:
                  $ref: '#/components/examples/SampleObservers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
      - Signature
      summary: Delete a Signature Request
      description: 'Deletes a `SignatureRequest` by its ID.


        **Important:** A `SignatureRequest` can only be deleted via the API if:


        1. the `SignatureRequest` has `status_overall=OPEN`, and


        2. the API user has sufficient rights on the `SignatureRequest`, e.g. when

        it was created by the API user.


        Deleting a `SignatureRequest` does not necessarily remove it from the

        system immediately.


        **WITHDRAWN**


        When the API user is the **owner** of the `SignatureRequest` and it is

        still in `status_overall=OPEN`, the `SignatureRequest` will be

        **WITHDRAWN**.


        This means the `SignatureRequest` will transition to

        `status_overall=WITHDRAWN` and all pending signatures will be marked with

        `status_code=WITHDRAWN`. Sign and read rights for all signers will be

        revoked, so invited signers can no longer read or sign the

        `SignatureRequest`.


        **REMOVE AS PARTICIPANT**


        When the API user is a participant but not the owner of the

        `SignatureRequest`, the `DELETE` request will only remove the API user as a

        participant.


        In this case, the system will remove the `SignatureRequest` and its related

        documents once the last remaining user deletes it via the Skribble web

        application.


        **DELETING**


        When the API user is the last user with access rights to the

        `SignatureRequest` (e.g. after a **WITHDRAW**), the `SignatureRequest` and

        its related documents will be permanently removed from the system.'
      operationId: deleteSignatureRequest
      security:
      - bearer: []
      parameters:
      - $ref: '#/components/parameters/SignatureIDPath'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    servers:
    - url: https://api.skribble.com/v3
      description: Production - Switzerland
    - url: https://api.skribble.de/v3
      description: Production - Germany
  /signature-requests/{SR_ID}/withdraw:
    post:
      tags:
      - Signature
      summary: Withdraw a Signature Request
      description: 'Withdraws a `SignatureRequest`, for example when signing becomes unnecessary

        or an error occurred during the invitation process. As the inviter, you can

        explicitly withdraw the `SignatureRequest`. This removes all signers and

        observers as participants and notifies them with a specified `message`.


        Similar to deletion, the `withdraw` action can only be executed if:


        - The `SignatureRequest` has `status_overall=OPEN`


        - The API user has sufficient rights on the `SignatureRequest`, such as

        when it was created by the API user.


        > **Note**

        > We recommend using the `delete` endpoint, which automatically determines

        > the appropriate action. For example, if the API user does not have

        > withdrawal rights, they may instead be removed as a participant, or the

        > document may be deleted directly.

        >

        > Use the `withdraw` endpoint specifically when you need to withdraw the

        > `SignatureRequest` while keeping it in Skribble.'
      operationId: withdrawSignatureRequest
      security:
      - bearer: []
      parameters:
      - $ref: '#/components/parameters/SignatureIDPath'
      requestBody:
        description: Request body to withdraw a SignatureRequest object
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawSignatureRequest'
            examples:
              Withdraw:
                summary: Withdraw with a message
                value:
                  message: The signature request is no longer required.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureResponse'
              examples:
                Sample1:
                  $ref: '#/components/examples/WithdrawSignatureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    servers:
    - url: https://api.skribble.com/v3
      description: Production - Switzerland
    - url: https://api.skribble.de/v3
      description: Production - Germany
  /signature-requests/{SR_ID}/documents:
    post:
      tags:
      - Signature
      summary: Add an additional document
      description: 'Adds an additional document to the `SignatureRequest` while it is still in `DRAFT` status.


        **Content size limits**:

        Very large document content is rejected by the gateway in front of the

        API before the request reaches it, returning a `403 Forbidden` response.

        This currently returns a plain body instead of the standard

        Problem+JSON error envelope used elsewhere in this API; a fix to align

        it is planned.'
      operationId: addDocumentInSignatureRequest
      security:
      - bearer: []
      parameters:
      - $ref: '#/components/parameters/SignatureIDPath'
      requestBody:
        description: Request body to add a Document
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentInSignature'
            examples:
              Base64Document:
                summary: Base64-encoded document
                value:
                  content: U29tZUJhc2U2NEVuY29kZWRJbWFnZQ==
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrPayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    servers:
    - url: https://api.skribble.com/v3
      description: Production - Switzerland
    - url: https://api.skribble.de/v3
      description: Production - Germany
  /signature-requests/{SR_ID}/documents/{DOC_ID}:
    delete:
      tags:
      - Signature
      summary: Remove a document
      description: 'Deletes the document identified by `DOC_ID` from the `SignatureRequest`

        with the ID `SR_ID`.'
      operationId: deleteDocumentInSignatureRequest
      security:
      - bearer: []
      parameters:
      - $ref: '#/components/parameters/SignatureIDPath'
      - $ref: '#/components/parameters/DocumentIDPath'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    servers:
    - url: https://api.skribble.com/v3
      description: Production - Switzerland
    - url: https://api.skribble.de/v3
      description: Production - Germany
components:
  schemas:
    ProblemResponse:
      title: Problem
      type: object
      description: 'Error response envelope returned for all 4xx and 5xx responses with a JSON body.

        Follows a Problem+JSON-style shape. The `key` field is optional and only present

        for errors that carry a machine-readable code.'
      required:
      - type
      - method
      - path
      - status
      - message
      properties:
        type:
          type: string
          format: uri
          description: 'URI identifying the problem category. The host of this URI depends on

            the environment the request was made against (e.g. `api.skribble.com`

            and `api.skribble.de` for the production regions; other environments

            use their respective hosts). Match on the path segment after `/problem/`

            rather than the full URI. Known values:


            - `https://api.skribble.com/problem/problem-with-message` — generic error with a message

            - `https://api.skribble.com/problem/entity-not-found` — requested resource does not exist

            - `https://api.skribble.com/problem/feature-not-enabled` — a required feature is not enabled for the business

            - `https://api.skribble.com/problem/constraint-violation` — request violates a domain constraint

            - `https://api.skribble.com/problem/parameterized` — parameterized error with details

            - `https://api.skribble.com/problem/limit-exceeded` — a usage limit was exceeded'
          example: https://api.skribble.com/problem/problem-with-message
        method:
          type: string
          description: HTTP method of the failing request.
          example: POST
        path:
          type: string
          description: Request URI of the failing request.
          example: /v2/signature-requests
        status:
          type: integer
          description: HTTP status code, mirroring the response status line.
          example: 400
        key:
          type: string
          description: 'Optional machine-readable error key. Present for a subset of errors that carry

            a stable code. Prefer matching on this field over parsing `message`, which is

            not part of the stable contract.


            Known keys, grouped by category:


            Authentication (`403`):


            - `error.auth.token_expired`: the access token has expired

            - `error.auth.token_invalid`: the access token is malformed or otherwise invalid

            - `error.auth.credentials_invalid`: the supplied credentials were rejected


            Rate limiting (`429`):


            - `error.rate_limit.exceeded`: a generic rate limit was exceeded

            - `error.rate_limit.reminder`: the per-signature-request reminder limit was exceeded


            File upload / attachment (`400`):


            - `file.attachment.unsupported`: the uploaded attachment type is not supported

            - `file.malware.detected`: malware was detected in the uploaded file


            PDF processing (`400`):


            - `file.pdf.general_error`: the PDF could not be loaded (corrupt or unreadable)

            - `file.pdf.encryption.unknown_password`: the PDF is encrypted with an unknown password

            - `file.pdf.encryption.no_changes_allowed`: the PDF''s signature permissions (DocMDP) do not allow the required changes

            - `file.pdf.encryption.unknown_permissions`: the PDF is encrypted with an unknown permissions type

            - `file.pdf.signature_verification.failed`: verification of an existing PDF signature failed


            Signature request (`400`):


            - `error.sr.last_document_cannot_be_removed`: the request would remove the only remaining document from the signature request; an SR must keep at least one document'
          example: file.attachment.unsupported
        message:
          type: string
          description: Human-readable error message.
          example: Validation failed for JSON object
    SignatureRecipientResponse_v3:
      title: Signature Callbacks Response
      type: object
      properties:
        sid:
          type: string
          format: uuid
          example: 894a0240-e01a-2307-4376-0267c6a8d105
        account_email:
          type: string
          format: email
          example: you@example.info
        document_signatures:
          type: array
          items:
            $ref: '#/components/schemas/SignatureDocument'
        signer_identity_data:
          $ref: '#/components/schemas/SignerIdentityDataResponse'
        sequence:
          type: integer
          format: int32
          example: -1
        status_code:
          $ref: '#/components/schemas/SignatureStatusCode_v3'
        notify:
          type: boolean
          description: 'Whether Skribble sends notification emails to this signer. When set to `false` together with

            `signer_identity_data.identity_reference`, the TAN-based email validation for No-Account-Signers (SES) is skipped.'
          example: true
        signing_url:
          type: string
          format: uri
          description: 'A personalized signing URL for this specific signer, distinct from the top-level signing_url of the SignatureRequest.

            It points to the Skribble web application and will directly open the document for signing

            provided that the user is known to Skribble and is logged in.

            Otherwise, the user must login or register first to be able to see the document.


            When the user visits this URL, they will be forwarded to a special preview page of the PDF document and can start the signature process as usual.


            You can add the following query parameters to this signing_url. Skribble will respect these parameters and redirect the user to the provided URLs once the signature process is finished.


            Example: `https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e/cd16bd0802d146fd94ff736d7d7bf551?exitURL=https%3A%2F%2Fmy-app.com%2Fsigned&redirectTimeout=10`


            | Parameter | Type | Description |

            | --- | --- | --- |

            | `exitURL` | string (URL-encoded) | Optional URL to redirect after the signature process finished. Example: `https%3A%2F%2Fgoogle.com` |

            | `errorURL` | string (URL-encoded) | Optional URL to redirect in case of an error. Defaults to `exitURL`. Ignored if `exitURL` is not set. Example: `https%3A%2F%2Fbing.com` |

            | `declineURL` | string (URL-encoded) | Optional URL to redirect when the user declines. Defaults to `exitURL`. Ignored if `exitURL` is not set. |

            | `hidedownload` | boolean | Optional flag to hide the download button on the success screen. Requires `exitURL` to be set. Example: `true` |

            | `redirectTimeout` | integer | Optional seconds before auto-redirect after signing. Min 0 (instant), max 90. Default: 45. Example: `20` |

            | `lang` | string | Optional language code to display the signing page in a specific language. Supported values: `en` (default), `de`, `fr`. Example: `lang=fr` |

            | `overlay` | boolean | Optional flag to show or hide the Skribble overlay on the signing page. |'
          example: https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e/cd16bd0802d146fd94ff736d7d7bf551
        decline_message:
          type: string
          description: The message provided by the signer when declining the signature request. Only present if the signer declined and provided a message.
        signed_at:
          type: string
          format: date-time
          description: Timestamp when this signer signed the document.
          example: '2025-10-09T12:15:30.000Z'
        signed_legislation:
          $ref: '#/components/schemas/SignatureLegislation'
          description: The legislation under which this signer's signature was created. Only present after signing.
        signed_quality:
          $ref: '#/components/schemas/SignatureQuality'
          description: The actual quality of this signer's signature. Only present after signing.
        last_viewed_at:
          type: string
          format: date-time
          description: Timestamp when this signer last viewed the document.
          example: '2025-10-09T12:10:00.000Z'
        language:
          type: string
          description: Language preference for this signer.
          example: en
        invited_by:
          type: string
          example: api_demo_example
    GroupObserverResponse:
      title: Group Observer Response
      type: object
      required:
      - id
      - type
      - invited_at
      - invited_by
      - group_info
      properties:
        id:
          type: string
          description: Unique observer identifier.
          example: ob_456
        type:
          type: string
          description: Observer type.
          const: GROUP
          example: GROUP
        invited_at:
          type: string
          format: date-time
          description: Timestamp when the observer was invited.
          example: '2026-02-02T12:34:56Z'
        invited_by:
          type: string
          description: Identifier of the user or API key that invited the observer.
          example: api_demo_example
        group_info:
          type: object
          description: Information about the group observer.
          required:
          - id
          - name
          properties:
            id:
              type: string
              description: Group ID.
              example: gr_456
            name:
              type: string
              description: Group name.
              example: Group 1
            version_id:
              type: string
              description: Group version identifier.
              example: gv_12
    UserObserverResponse:
      title: User Observer Response
      type: object
      required:
      - id
      - type
      - invited_at
      - invited_by
      - user_info
      properties:
        id:
          type: string
          description: Unique observer identifier.
          example: ob_123
        type:
          type: string
          description: Observer type.
          const: USER
          example: USER
        invited_at:
          type: string
          format: date-time
          description: Timestamp when the observer was invited.
          example: '2026-02-02T12:34:56Z'
        invited_by:
          type: string
          description: Identifier of the user or API key that invited the observer.
          example: api_demo_example
        user_info:
          type: object
          description: Information about the user observer.
          properties:
            id:
              type: string
              description: User ID.
              example: '123'
            email:
              type: string
              format: email
              description: User email address.
              example: you@example.info
    UploadDocumentInSignature:
      title: Signature Document Upload
      type: object
      properties:
        content:
          type: string
          format: byte
          description: Base64 encoded bytes of the document. Maximum document size is **112.5 MB** unencoded (**150 MB** Base64-encoded).
          example: U29tZUJhc2U2NEVuY29kZWRJbWFnZQ==
    SignatureQuality:
      title: Signature Quality
      type: string
      description: 'Minimal quality of the signatures for this signature request.


        | Quality | Description |

        | --- | --- |

        | **QES** | Every signer must use QES. This is the **default** quality. Requires a `legislation` parameter. |

        | **AES_MINIMAL** | Signers will use QES if available, otherwise AES. At least AES is guaranteed. Requires a `legislation` parameter. |

        | **AES** | Every signer uses AES. |

        | **SES** | Every signer uses SES. |

        | **DEMO** | Every signer uses a DEMO signature with **no legal binding**. API demo users (`api_demo_example_*`) get this quality by default. |

        | **PART11** | Signers use a signature compliant with 21 CFR Part 11 regulations. |'
      enum:
      - SES
      - AES
      - AES_MINIMAL
      - QES
      - DEMO
      - PART11
      example: QES
    SignatureAttachment:
      title: Signature Attachment
      type: object
      properties:
        attachment_id:
          type: string
          format: uuid
          example: 8ed33046-3798-8c54-0b13-0820d0d6e121
        filename:
          type: string
          example: Attachment.pdf
    SignerIdentityData:
      title: Signer Identity Data
      type: object
      description: Optional (no-account) signer identity information.
      properties:
        email_address:
          type: string
          format: email
          description: Email address of no-account-signer. Mandatory when `quality` is `SES`.
          example: no-account@skribble.com
        first_name:
          type: string
          description: First name of no-account-signer
          example: John
        last_name:
          type: string
          description: Last name of no-account-signer
          example: Doe
        mobile_number:
          type: string
          description: 'Mobile number of the no-account-signer in E.164 format without the leading `+`:

            country code + area code + number, no spaces or special characters.'
          example: '41791234567'
        language:
          $ref: '#/components/schemas/SignatureLanguage'
        provider:
          type: string
          description: Evidence provider where Skribble can verify the signer's identity data.
          example: some-provider
        identity_reference:
          type: string
          description: 'Optional customer-generated identifier for further identification. When set together with `notify: false`,

            the TAN-based email validation for No-Account-Signers (SES) is skipped, allowing signers to sign directly

            without the Skribble TAN process.'
          example: Internal-ID-012345
        identification_require_evidence:
          type: boolean
          description: '(optional) if set, even if the signer is already identified, a new identification process is started to get fresh evidence records.

            Only supported when the signature request''s quality is `QES` and Express QES is enabled for the business;

            otherwise the request fails with a validation error.'
          example: true
        force_standard_qes:
          type: boolean
          description: '(optional) if set to `true`, this signer is always identified via the standard QES flow and is never routed

            through Express QES, regardless of the business''s Express QES setting or other identity flags such as

            `identification_require_evidence`.'
          example: true
    SignatureLegislation:
      title: Signature Legislation
      type: string
      description: 'Legislation under which the signatures are created. Required when `quality` is `QES` or `AES_MINIMAL`.


        | Legislation | Description |

        | --- | --- |

        | **ZERTES** | QES according to Swiss law. This is the **default**. |

        | **EIDAS** | QES according to EU law. |'
      enum:
      - ZERTES
      - EIDAS
      example: ZERTES
    WithdrawSignatureRequest:
      title: Withdraw Signature Request
      type: object
      properties:
        message:
          type: string
          description: Withdraw message.
          minLength: 0
          maxLength: 2048
          example: The reason for withdrawing the signature.
    SignatureStatusOverall_v3:
      title: Signature Status Overall
      type: string
      description: "Overall signing status of the document.\n\nPossible values:\n  - **DRAFT** The signature request has not yet been placed.\n  - **OPEN** At least one user has not signed or declined their signature yet.\n  - **DECLINED** At least one user declined to sign. The signature request failed.\n  - **WITHDRAWN** The owner has withdrawn the signature request.\n  - **SIGNED** All users signed the document. The signature request was successfully completed.\n  - **EXPIRED** The owner-set `expires_at` date has passed before all signers signed. Terminal status.\n  - **ERROR** A technical error occurred. The signature request cannot be completed."
      enum:
      - DRAFT
      - OPEN
      - DECLINED
      - WITHDRAWN
      - SIGNED
      - EXPIRED
      - ERROR
      example: OPEN
    VisualSignatureResponse:
      title: Visual Signature Response
      type: object
      description: Visual signature placement information.
      properties:
        image:
          $ref: '#/components/schemas/VisualSignatureImage'
        position:
          description: Position where the signature should appear.
          $ref: '#/components/schemas/VisualSignaturePosition'
        positions:
          type: array
          description: List of additional positions where the signature should appear.
          items:
            $ref: '#/components/schemas/VisualSignaturePosition'
        form_field:
          type: string
          description: 'Name of the form field in which the signature is placed. If multiple fields of this name are present in the document, all will be used. Takes precedence before positions.

            '
          example: Signature1
        text:
          type: object
          description: Text displayed inside the form field.
          properties:
            content:
              type: string
              description: Content of the text field.
              example: Customer Signature
            font_name:
              type: string
              description: 'Font name used. For PDF: all default PDF fonts or fonts already embedded in the document.

                '
              example: Helvetica-Bold
            font_size:
              type: string
              description: Font size used.
              example: '12'
            font_color:
              type: string
              description: Font color as RGB value encoded in hex.
              example: '#ff0000'
    SignatureRecipientResponse:
      title: Signature Callbacks Response
      type: object
      properties:
        sid:
          type: string
          format: uuid
          example: 894a0240-e01a-2307-4376-0267c6a8d105
        status_code:
          $ref: '#/components/schemas/SignatureStatusCode'
        account_email:
          type: string
          format: email
          example: you@example.info
        signer_identity_data:
          $ref: '#/components/schemas/SignerIdentityDataResponse'
        sequence:
          type: integer
          format: int32
          example: -1
        notify:
          type: boolean
          description: 'Whether Skribble sends notification emails to this signer. When set to `false` together with

            `signer_identity_data.identity_reference`, the TAN-based email validation for No-Account-Signers (SES) is skipped.'
          example: true
        signing_url:
          type: string
          format: uri
          description: 'A personalized signing URL for this specific signer, distinct from the top-level signing_url of the SignatureRequest.

            It points to the Skribble web application and will directly open the document for signing

            provided that the user is known to Skribble and is logged in.

            Otherwise, the user must login or register first to be able to see the document.


            When the user visits this URL, they will be forwarded to a special preview page of the PDF document and can start the signature process as usual.


            You can add the following query parameters to this signing_url. Skribble will respect these parameters and redirect the user to the provided URLs once the signature process is finished.


            Example: `https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e/cd16bd0802d146fd94ff736d7d7bf551?exitURL=https%3A%2F%2Fmy-app.com%2Fsigned&redirectTimeout=10`


            | Parameter | Type | Description |

            | --- | --- | --- |

            | `exitURL` | string (URL-encoded) | Optional URL to redirect after the signature process finished. Example: `https%3A%2F%2Fgoogle.com` |

            | `errorURL` | string (URL-encoded) | Optional URL to redirect in case of an error. Defaults to `exitURL`. Ignored if `exitURL` is not set. Example: `https%3A%2F%2Fbing.com` |

            | `declineURL` | string (URL-encoded) | Optional URL to redirect when the user declines. Defaults to `exitURL`. Ignored if `exitURL` is not set. |

            | `hidedownload` | boolean | Optional flag to hide the download button on the success screen. Requires `exitURL` to be set. Example: `true` |

            | `redirectTimeout` | integer | Optional seconds before auto-redirect after signing. Min 0 (instant), max 90. Default: 45. Example: `20` |

            | `lang` | string | Optional language code to display the signing page in a specific language. Supported values: `en` (default), `de`, `fr`. Example: `lang=fr` |

            | `overlay` | boolean | Optional flag to show or hide the Skribble overlay on the signing page. |'
          example: https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e/cd16bd0802d146fd94ff736d7d7bf551
        decline_message:
          type: string
          description: The message provided by the signer when declining the signature request. Only present if the signer declined and provided a message.
        signed_at:
          type: string
          format: date-time
          description: Timestamp when this signer signed the document.
          example: '2025-10-09T12:15:30.000Z'
        signed_legislation:
          $ref: '#/components/schemas/SignatureLegislation'
          description: The legislation under which this signer's signature was created. Only present after signing.
        signed_quality:
          $ref: '#/components/schemas/SignatureQuality'
          description: The actual quality of this signer's signature. Only present after signing.
        last_viewed_at:
          type: string
          format: date-time
          description: Timestamp when this signer last viewed the document.
          example: '2025-10-09T12:10:00.000Z'
        language:
          type: string
          description: Language preference for this signer.
          example: en
        visual_signature:
          $ref: '#/components/schemas/VisualSignatureResponse'
    SignatureDocument:
      title: Signer Document to Sign
      type: object
      properties:
        document_id:
          type: string
          description: Unique Document ID.
          format: uuid
          example: f1e2d3c4-7b8a-4e6f-9d3b-123456789abc
        visual_signature:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VisualSignature_v3'
    VisualSignature_v3:
      description: Visual signature placement information.
      oneOf:
      - type: object
        title: Multiple Positions
        description: Use multiple explicit positions.
        required:
        - positions
        properties:
          positions:
            type: array
            items:
              $ref: '#/components/schemas/VisualSignaturePosition'
          image:
            $ref: '#/components/schemas/VisualSignatureImage'
          position:
            description: Must not be provided when positions are used.
            readOnly: true
          form_field:
            description: Must not be provided when positions are used.
            readOnly: true
      - type: object
        title: Form Field
        description: Use a form field only.
        required:
        - form_field
        properties:
          form_field:
            type: string
            description: 'Name of the form field in which the signature is placed. If multiple fields of this name are present in the document, all will be used.

              '
          image:
            $ref: '#/components/schemas/VisualSignatureImage'
          position:
            description: Must not be provided when form_field is used.
            readOnly: true
          positions:
            description: Must not be provided when form_field is used.
            readOnly: true
    SignatureResponse_v3:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 4f43614a-de50-bfe1-2df3-4c881fc7840e
        title:
          type: string
          example: Example contract
        message:
          type: string
          example: Please sign this document!
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInSignatureResponse'
        legislation:
          $ref: '#/components/schemas/SignatureLegislation'
        quality:
          $ref: '#/components/schemas/SignatureQuality'
        signing_url:
          type: string
          format: uri
          description: The URL for the SignatureRequest owner to view and manage the request in the Skribble web application. This URL is not intended for signers — each signer has their own dedicated signing_url within the signatures array.
          example: https://my.skribble.com/view/4f43614a-de50-bfe1-2df3-4c881fc7840e
        status_overall:
          $ref: '#/components/schemas/SignatureStatusOverall_v3'
        business_id:
          type: string
          example: biz-42b4c2fb9ee947778ba70bc0698c78f7
        signatures:
          type: array
          items:
            $ref: '#/components/schemas/SignatureRecipientResponse_v3'
        origin:
          type: string
          example: API
        observers:
          type: array
          items:
            $ref: '#/components/schemas/SignatureObserverResponse'
          example: []
        auto_delete_at:
          type: string
          format: date
          description: 'Server-managed date on which this signature request and its related documents are automatically

            deleted in line with the owning business''s retention policy. Not directly settable by API clients.

            May be absent or `null` when no retention policy applies.'
          example: '2026-04-21'
        expires_at:
          type: string
          format: date
          description: 'Owner-set expiry date for this signature request. When this date passes, the request

            transitions to `status_overall=EXPIRED`. Set via `expires_at` on create/update;

            clear via `DELETE /signature-requests/{SR_ID}/expires-at`.

            Absent or `null` when no owner-set expiry has been configured.'
          example: '2026-12-31'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/SignatureAttachment'
          example: []
        attach_on_success:
          $ref: '#/components/schemas/AttachOnSuccess'
        custom:
          type: string
          description: Custom field for storing application-specific data related to this signature request.
          example: MyCustomvalue1,MyVal2
        owner:
          type: string
          example: api_demo_example
        read_access:
          type: array
          description: Users or API keys with read access to this signature request.
          items:
            type: string
          example:
          - persononetosign@external.net
          - api_demo_example
          - you@example.info
          - persontwotosign@external.net
        write_access:
          type: array
          description: Users or API keys with write access to this signature request.
          items:
            type: string
          example:
          - api_demo_example
        created_at:
          type: string
          format: date-time
          example: '2025-10-08T17:37:03.569Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-10-08T17:37:03.569Z'
        initiated_at:
          type: string
          format: date-time
          example: '2025-10-08T17:37:03.569Z'
        callback_success_url:
          type: string
          description: Callback URL called on overall success. See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/success
        callback_error_url:
          type: string
          description: Callback URL called when a signer declines or the request is withdrawn. See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/error
        callback_update_url:
          type: string
          description: Callback URL called on any update (e.g. one signer signed). See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/update
        callback_start_sign_url:
          type: string
          description: Callback URL called when a signer starts the signature process (only for Express QES). See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/start-sign
        callback_ident_pending_url:
          type: string
          description: Callback URL called when the identification of a signer requires manual review. See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/ident-pending
        callback_ident_error_url:
          type: string
          description: Callback URL called when the identification of a signer ends in an error. See the request schema for supported placeholders and retry behaviour.
          format: uri
          example: https://mybiz.com/call/ident-error
    PayloadTooLarge:
      type: string
      description: 'Plain-text or HTML body returned by the gateway in front of the API when

        a request is rejected for exceeding the maximum allowed size, before it

        reaches the API. Pending a fix to align this with the standard

        Problem+JSON envelope used elsewhere in this API.'
    AttachOnSuccess:
      title: Attachment when signed
      type: array
      description: "When a SignatureRequest has been signed by all signers, all signers and all observers are notified by email.\nSkribble provides the option to attach two types of attachments automatically to this email:\n  - the signed document and\n  - the signature protocol.\n\nThis can be configured via the business settings, which can be used to define that these documents should generally\nbe attached for all SignatureRequests created by business members.\n\nAlternatively it is possible to define the attachments on demand per SignatureRequest by using this field."
      items:
        type: string
        enum:
        - SIGNED_DOCUMENT
        - SIGNATURE_PROTOCOL
      example:
      - SIGNED_DOCUMENT
      - SIGNATURE_PROTOCOL
